# shellcheck shell=bash
# Fields are consumed by scripts/host-dependencies.sh.
# shellcheck disable=SC2034
# Declarative dependency profile: debian. Setup runs only during installation.
PACKAGE_MANAGERS=(apt-get)
USE_PIP_CMAKE=false
PACKAGES=(
    "coreutils"
    "automake"
    "bison"
    "bzip2"
    "ca-certificates"
    "cmake"
    "curl"
    "file"
    "flex"
    "g++"
    "gawk"
    "gdb"
    "git"
    "gperf"
    "help2man"
    "libncurses-dev"
    "libssl-dev"
    "libtool-bin"
    "make"
    "patch"
    "pkg-config"
    "python3"
    "rsync"
    "texinfo"
    "unzip"
    "wget"
    "xz-utils"
    "tar"
    "util-linux"
)
MIRROR_SETUP_COMMANDS=()
EXTRA_SETUP_COMMANDS=(setup_pip_cmake)
