# shellcheck shell=bash
# Fields are consumed by scripts/host-dependencies.sh.
# shellcheck disable=SC2034
# Declarative dependency profile: alinux3. Setup runs only during installation.
PACKAGE_MANAGERS=(dnf yum)
USE_PIP_CMAKE=false
PACKAGES=(
    "coreutils"
    "automake"
    "bison"
    "bzip2"
    "ca-certificates"
    "cmake"
    "curl"
    "diffutils"
    "file"
    "flex"
    "gawk"
    "gcc"
    "gcc-c++"
    "gdb"
    "git"
    "gperf"
    "help2man"
    "libstdc++-static"
    "libtool"
    "make"
    "ncurses-devel"
    "openssl-devel"
    "patch"
    "pkgconfig"
    "python3"
    "python3-pip"
    "rsync"
    "tar"
    "texinfo"
    "unzip"
    "util-linux"
    "wget"
    "which"
    "xz"
)
MIRROR_SETUP_COMMANDS=(setup_alinux_repositories)
EXTRA_SETUP_COMMANDS=(setup_pip_cmake)
