# shellcheck shell=bash
# Fields are consumed by scripts/host-dependencies.sh.
# shellcheck disable=SC2034
# Declarative dependency profile: arch. Setup runs only during installation.
PACKAGE_MANAGERS=(pacman)
USE_PIP_CMAKE=false
PACKAGES=(
    "coreutils"
    "automake"
    "bison"
    "bzip2"
    "ca-certificates"
    "cmake"
    "curl"
    "file"
    "flex"
    "gcc"
    "gawk"
    "gdb"
    "git"
    "gperf"
    "help2man"
    "ncurses"
    "openssl"
    "libtool"
    "make"
    "patch"
    "pkgconf"
    "python"
    "rsync"
    "texinfo"
    "unzip"
    "wget"
    "which"
    "xz"
    "tar"
    "util-linux"
)
MIRROR_SETUP_COMMANDS=()
EXTRA_SETUP_COMMANDS=(setup_pip_cmake)
